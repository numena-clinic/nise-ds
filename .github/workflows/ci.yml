name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reproducible tokens first: a stale src/tokens/tokens.css fails here.
      - run: npm run tokens:validate
      - run: npm run check:usage
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build-storybook
      # The Theme Explorer is a real build; prove it compiles in CI too.
      - run: npm run build:explorer
