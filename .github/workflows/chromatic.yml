name: Chromatic
on:
  push:
    branches: [master, portfolio-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # Fork PRs do not receive repository secrets. No untrusted workflow elevation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Publish and review visual changes
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: npm run chromatic
      - name: Explain missing configuration
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo 'Add CHROMATIC_PROJECT_TOKEN as a repository Actions secret to publish. No build was published.' >> "$GITHUB_STEP_SUMMARY"
